<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar IA — Leads Almería</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }
  header { padding:20px 24px; border-bottom:1px solid #1e293b; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:20px; font-weight:700; }
  header h1 span { color:#38bdf8; }
  .pill { padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600; }
  .p-red { background:#7f1d1d; color:#fca5a5; } .p-orange { background:#7c2d12; color:#fdba74; } .p-gray { background:#1e293b; color:#94a3b8; }
  .stats { display:flex; gap:12px; padding:16px 24px; flex-wrap:wrap; }
  .card { background:#1e293b; border-radius:12px; padding:14px 20px; min-width:130px; }
  .card b { font-size:26px; display:block; }
  .controls { display:flex; gap:10px; padding:0 24px 14px; flex-wrap:wrap; }
  button.filtro { background:#1e293b; color:#cbd5e1; border:1px solid #334155; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; }
  button.filtro.activo { background:#38bdf8; color:#0f172a; border-color:#38bdf8; font-weight:700; }
  input { background:#1e293b; border:1px solid #334155; color:#e2e8f0; padding:8px 14px; border-radius:8px; font-size:13px; width:260px; }
  table { width:calc(100% - 48px); margin:0 24px 30px; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:10px 12px; color:#94a3b8; font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:2px solid #334155; position:sticky; top:0; background:#0f172a; }
  td { padding:10px 12px; border-bottom:1px solid #1e293b; vertical-align:top; }
  tr:hover td { background:#16213a; }
  .score { font-weight:800; font-size:16px; }
  .motivos { color:#94a3b8; font-size:12px; max-width:340px; }
  .quote { color:#fbbf24; font-style:italic; font-size:12px; max-width:280px; }
  a { color:#38bdf8; text-decoration:none; } a:hover { text-decoration:underline; }
  details summary { cursor:pointer; color:#64748b; font-size:11px; }
  .tel { color:#a5b4fc; font-weight:600; white-space:nowrap; }
  #cargando { padding:60px; text-align:center; color:#64748b; }
</style>
<base target="_blank">
</head>
<body>
<header>
  <h1>📡 Radar <span>IA</span> — Leads Almería</h1>
  <span class="pill p-red">🔥 CALIENTE</span>
  <span class="pill p-orange">🟡 TIBIO</span>
  <span class="pill p-gray">⚪ BAJO</span>
</header>

<div class="stats">
  <div class="card"><b id="sTotal">–</b>negocios</div>
  <div class="card"><b id="sHot" style="color:#f87171">–</b>calientes</div>
  <div class="card"><b id="sWarm" style="color:#fdba74">–</b>tibios</div>
  <div class="card"><b id="sTop">–</b>lead top score</div>
</div>

<div class="controls">
  <button class="filtro activo" data-f="TODOS">Todos</button>
  <button class="filtro" data-f="CALIENTE">🔥 Calientes</button>
  <button class="filtro" data-f="TIBIO">🟡 Tibios</button>
  <button class="filtro" data-f="BAJO">⚪ Bajos</button>
  <input id="buscar" placeholder="🔍 Buscar por nombre...">
</div>

<div id="cargando">Cargando leads desde Supabase…</div>
<table id="tabla" style="display:none">
  <thead><tr>
    <th>Score</th><th>Negocio</th><th>Teléfono</th><th>Vertical</th><th>Señales detectadas</th><th>Frase para el pitch</th><th>Mapa</th>
  </tr></thead>
  <tbody id="filas"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ==== CONFIGURA AQUÍ (la clave anon es pública y segura: solo lectura) ====
const SUPABASE_URL = "https://yjiifqgpkoiixclzdofz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqaWlmcWdwa29paXhjbHpkb2Z6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzUyOTA1MCwiZXhwIjoyMTA5MTA1MDUwfQ.pngjTXZdM_TFsu0X3CVmsUImMq1lYXzFrmw-RXvR4Fw";
// =======================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let datos = [], filtro = "TODOS", busqueda = "";

function colorScore(s){ return s >= 70 ? "#f87171" : s >= 45 ? "#fdba74" : "#64748b"; }
function pill(t){ return t==="CALIENTE" ? "p-red" : t==="TIBIO" ? "p-orange" : "p-gray"; }

function render(){
  const filtrados = datos.filter(d =>
    (filtro==="TODOS" || d.tier===filtro) &&
    d.nombre.toLowerCase().includes(busqueda));
  document.getElementById("filas").innerHTML = filtrados.map(d => `
    <tr>
      <td class="score" style="color:${colorScore(d.score)}">${d.score}</td>
      <td><b>${d.nombre}</b><br><span class="pill ${pill(d.tier)}">${d.tier}</span></td>
      <td class="tel">${d.telefono || "—"}</td>
      <td>${d.categoria || "—"}</td>
      <td class="motivos">${d.motivos || ""}</td>
      <td class="quote">${d.quote ? "«" + d.quote + "»" : "—"}</td>
      <td>${d.maps_url ? `<a href="${d.maps_url}" target="_blank">Google Maps ↗</a>` : "—"}</td>
    </tr>`).join("");
}

async function cargar(){
  const { data, error } = await sb.from("businesses").select("*").order("score", {ascending:false});
  const carg = document.getElementById("cargando");
  if (error) { carg.innerHTML = "❌ Error: " + error.message + "<br>Revisa SUPABASE_URL y la anon key en el código."; return; }
  datos = data;
  carg.style.display = "none";
  document.getElementById("tabla").style.display = "table";
  document.getElementById("sTotal").textContent = data.length;
  document.getElementById("sHot").textContent = data.filter(d=>d.tier==="CALIENTE").length;
  document.getElementById("sWarm").textContent = data.filter(d=>d.tier==="TIBIO").length;
  document.getElementById("sTop").textContent = data.length ? data[0].score : 0;
  render();
}

document.querySelectorAll(".filtro").forEach(b => b.onclick = () => {
  document.querySelectorAll(".filtro").forEach(x => x.classList.remove("activo"));
  b.classList.add("activo"); filtro = b.dataset.f; render();
});
document.getElementById("buscar").oninput = e => { busqueda = e.target.value.toLowerCase(); render(); };
cargar();
</script>
</body>
</html>
